<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>영상 완성 V6.4</title>
<style>
body{font-family:Arial,sans-serif;background:#fff7ef;margin:0}.wrap{max-width:760px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 10px #0001}.btn{display:block;text-align:center;background:#111;color:#fff;text-decoration:none;padding:18px;border-radius:12px;font-size:20px;font-weight:bold;margin:14px 0}.orange{background:#ff6f0f}.err{color:#c00;font-weight:bold}video{width:100%;border-radius:12px;background:#000}</style></head>
<body><div class="wrap"><div class="card">
<h1>🥕 V6.4 영상 결과</h1>
{% if error %}
<p class="err">❌ {{ error }}</p>
<a class="btn orange" href="/">← 다시 만들기</a>
{% else %}
<h2>✅ 영상 완성!</h2><p>생성 시간 {{ seconds }}초</p>
<video controls playsinline src="/output/{{ filename }}"></video>
<a class="btn" href="/download/{{ filename }}">⬇️ MP4 다운로드</a>
<a class="btn orange" href="/output/{{ filename }}" target="_blank">▶️ 영상 새 창에서 열기</a>
<a class="btn orange" href="/">← 새 영상 만들기</a>
{% endif %}
</div></div></body></html>
