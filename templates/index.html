<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>당근 제휴광고 제작기 V6.4</title>
<style>
body{font-family:Arial,sans-serif;background:#fff7ef;margin:0;color:#222}.wrap{max-width:820px;margin:auto;padding:18px}.badge{display:inline-block;background:#111;color:#fff;border-radius:999px;padding:6px 10px;font-size:13px}.card{background:white;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 2px 10px #0001}input,select{width:100%;box-sizing:border-box;padding:13px;margin:6px 0 12px;border:1px solid #ddd;border-radius:10px;font-size:16px}button{background:#ff6f0f;color:#fff;border:0;border-radius:11px;padding:16px;font-weight:bold;font-size:18px;width:100%}.muted{color:#777;font-size:13px}</style></head>
<body><div class="wrap"><span class="badge">현재 버전 V6.4</span><h1>🥕 당근 제휴광고 제작기</h1>
<p class="muted">이번 버전은 영상 생성 후 새 결과 페이지로 이동하므로 JavaScript 상태표시에 의존하지 않습니다.</p>
<div class="card"><h2>이미지 → 광고영상</h2>
<form action="/video-form" method="post" enctype="multipart/form-data">
<label>상품명</label><input name="product" required>
<label>광고 제목</label><input name="title">
<label>첫 3초 후킹</label><input name="hook" placeholder="비워두면 자동">
<label>핵심 포인트 1</label><input name="point1" placeholder="비워두면 자동">
<label>핵심 포인트 2</label><input name="point2" placeholder="비워두면 자동">
<label>마지막 CTA</label><input name="cta" value="자세한 조건은 바로가기">
<label>길이</label><select name="duration"><option value="15">15초</option><option value="30">30초</option></select>
<label>DBsense/광고주 사용 허가 이미지</label><input name="images" type="file" accept="image/*" multiple required>
<button type="submit">🎬 영상 만들고 다운로드 화면으로 이동</button>
</form></div></div></body></html>
