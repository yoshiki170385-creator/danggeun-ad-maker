<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>당근 제휴광고 이미지 제작기 FINAL</title>
<style>
body{font-family:Arial,sans-serif;background:#fff7ef;margin:0;color:#171717}.wrap{max-width:880px;margin:0 auto;padding:24px}.badge{display:inline-block;background:#111;color:#fff;border-radius:999px;padding:8px 13px;font-size:13px}.card{background:#fff;border-radius:22px;padding:24px;margin-top:18px;box-shadow:0 5px 22px rgba(0,0,0,.07)}label{display:block;font-weight:800;margin-top:14px}input{width:100%;box-sizing:border-box;padding:15px;margin-top:7px;border:1px solid #ddd;border-radius:12px;font-size:16px}button{width:100%;background:#ff6f0f;color:#fff;border:0;border-radius:14px;padding:18px;margin-top:22px;font-size:19px;font-weight:900}.tip{background:#fff2e8;border-radius:14px;padding:14px;line-height:1.6}.muted{font-size:13px;color:#777;line-height:1.6}
</style></head><body><div class="wrap">
<span class="badge">최종판 · 당근 이미지 광고 전용</span>
<h1>🥕 당근 제휴광고 이미지 제작기</h1>
<p class="muted">DBsense 이미지 1장으로 당근 광고 테스트용 이미지 5종과 광고 제목 5개를 만듭니다. 외부 AI/API를 사용하지 않습니다.</p>
<div class="card"><div class="tip"><b>입력은 4개만:</b> 상품명 · 브랜드명 · DBsense 원본 링크 · 광고주 사용 허가 이미지</div>
<form action="/make-images" method="post" enctype="multipart/form-data">
<label>상품명 *</label><input name="product" required placeholder="예: 코웨이 정수기 렌탈">
<label>업체/브랜드명</label><input name="brand" placeholder="예: 코웨이">
<label>DBsense 원본 홍보링크 *</label><input name="url" required placeholder="https://...">
<label>DBsense/광고주 사용 허가 이미지 *</label><input name="image" type="file" accept="image/*" required>
<button type="submit">🖼️ 당근 광고 이미지 5종 만들기</button>
</form></div></div></body></html>
