<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ff7e36"><link rel="manifest" href="/manifest.webmanifest"><title>당근 제휴광고 제작기 V5</title><style>
:root{--a:#ff7e36;--bg:#f6f6f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:#18181b}.w{max-width:850px;margin:auto;padding:14px 14px 70px}.hero h1{font-size:25px;margin:8px 0}.hero p,.small{color:#777;font-size:13px}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}.tab{border:0;border-radius:12px;padding:12px 5px;font-weight:800;background:#e8e8eb}.tab.on,.primary{background:var(--a);color:white}.card{background:white;border-radius:18px;padding:16px;margin:11px 0;box-shadow:0 1px 7px #0000000d}label{display:block;font-size:14px;font-weight:800;margin:12px 0 6px}input,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;font-size:16px}.primary,.copy{width:100%;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:800;margin-top:10px}.copy{background:#eee}.hidden{display:none}.step{border:1px solid #eee;border-radius:13px;padding:13px;margin:9px 0}.value{font-weight:800;font-size:17px;word-break:break-all;padding:7px 0}.note{font-size:12px;color:#777}.title{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #eee}.title button{border:0;border-radius:8px;padding:8px}.info{background:#fff2ea;border:1px solid #ffd1b8;padding:12px;border-radius:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#fafafa;border-radius:12px;padding:12px}.metric b{display:block;font-size:20px}</style></head>
<body><div class="w"><div class="hero"><h1>🥕 당근 제휴광고 제작기 V5</h1><p>디비센스 이미지 1장만 있어도 광고영상 자동 제작</p></div>
<div class="tabs"><button class="tab on" onclick="show('a',this)">광고 등록</button><button class="tab" onclick="show('v',this)">이미지→영상</button><button class="tab" onclick="show('p',this)">수익 분석</button></div>
<section id="a"><div class="card"><label>상품명</label><input id="product" placeholder="예: 코웨이 정수기 렌탈"><label>업체/브랜드명</label><input id="brand"><label>디비센스 원본 홍보링크</label><input id="url" placeholder="https://..."><label>행동 유도</label><select id="cta"><option>바로가기</option><option>문의하기</option><option>구매하기</option><option>신청하기</option></select><button class="primary" onclick="gen()">🚀 당근 등록용 만들기</button></div><div id="res" class="hidden"><div class="card"><h3>당근 등록 가이드</h3><div id="steps"></div></div><div class="card"><h3>광고 제목 TOP 10</h3><div id="titles"></div></div></div></section>
<section id="v" class="hidden"><div class="card"><h3>🎬 이미지 1장도 영상으로</h3><div class="info">한 장이면 장면마다 <b>확대·크롭·위치</b>를 바꿔 여러 장면처럼 만듭니다.</div><label>영상 길이</label><select id="seconds"><option value="15">15초</option><option value="30">30초</option></select><label>광고 제목</label><input id="videoTitle"><label>디비센스 제공 이미지</label><input id="images" type="file" accept="image/*" multiple><label>배경음악 (선택)</label><input id="bgm" type="file" accept="audio/*"><p class="small">사용 권한이 있는 이미지와 BGM만 사용하세요.</p><button class="primary" onclick="video()">🎥 자동 광고영상 만들기</button><div id="vs"></div></div></section>
<section id="p" class="hidden"><div class="card"><h3>📊 수익 분석</h3><div class="grid"><div><label>노출수</label><input id="imp" type="number" value="0"></div><div><label>클릭수</label><input id="clk" type="number" value="0"></div><div><label>광고비</label><input id="sp" type="number" value="0"></div><div><label>전환수</label><input id="cv" type="number" value="0"></div><div><label>디비센스 수익</label><input id="rev" type="number" value="0"></div></div><button class="primary" onclick="profit()">분석하기</button></div><div id="pr" class="hidden card"></div></section>
</div><script>
let reg=[];function show(id,b){document.querySelectorAll("section").forEach(x=>x.classList.add("hidden"));document.getElementById(id).classList.remove("hidden");document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));b.classList.add("on")}function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function gen(){const d={product:product.value,brand:brand.value,url:url.value,cta:cta.value};localStorage.setItem("v5",JSON.stringify(d));const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});const j=await r.json();if(!j.ok){alert(j.error);return}reg=j.registration;videoTitle.value=j.recommended;steps.innerHTML=j.registration.map((x,i)=>`<div class="step"><b>STEP ${i+1} · ${esc(x[0])}</b><div class="value">${esc(x[1])}</div><div class="note">${esc(x[2])}</div><button class="copy" onclick="copy(${i})">이 값 복사</button></div>`).join("");titles.innerHTML=j.titles.map((t,i)=>`<div class="title"><span>${i+1}. ${esc(t)}</span><button onclick="pick(${JSON.stringify(t)})">선택</button></div>`).join("");res.classList.remove("hidden")}
function copy(i){navigator.clipboard.writeText(reg[i][1]).then(()=>alert("복사했습니다."))}function pick(t){videoTitle.value=t;navigator.clipboard.writeText(t);alert("제목을 선택하고 복사했습니다.")}
async function video(){const d=JSON.parse(localStorage.getItem("v5")||"{}");if(!d.product){alert("먼저 광고 등록 탭을 작성하세요.");return}if(images.files.length<1){alert("이미지를 1장 이상 넣어주세요.");return}const f=new FormData();f.append("product",d.product);f.append("title",videoTitle.value);f.append("seconds",seconds.value);[...images.files].forEach(x=>f.append("images",x));if(bgm.files[0])f.append("bgm",bgm.files[0]);vs.innerHTML="<p>영상 생성 중...</p>";const r=await fetch("/api/video",{method:"POST",body:f});const j=await r.json();if(!j.ok){vs.innerHTML=`<p>${esc(j.error)}</p>`;return}vs.innerHTML=`<div class="info"><b>완성!</b><p>${esc(j.note)}</p><a href="${j.download}" style="display:block;text-align:center;background:#ff7e36;color:white;padding:14px;border-radius:12px;text-decoration:none;font-weight:800">⬇️ MP4 저장</a></div>`}
function n(id){return Number(document.getElementById(id).value||0)}function profit(){let I=n("imp"),C=n("clk"),S=n("sp"),V=n("cv"),R=n("rev"),d=(a,b)=>b?a/b:0,ctr=d(C,I)*100,cpc=d(S,C),cvr=d(V,C)*100,cpa=d(S,V),roas=d(R,S)*100,np=R-S;let v="🟡 데이터 더 필요";if(V>0&&np>0)v="🟢 확대 후보";else if(S>0&&np<0)v="🔴 중단 검토";else if(C>0&&V===0)v="🟡 관찰/수정";pr.innerHTML=`<h3>${v}</h3><div class="grid"><div class="metric">CTR<b>${ctr.toFixed(2)}%</b></div><div class="metric">CPC<b>${Math.round(cpc).toLocaleString()}원</b></div><div class="metric">전환율<b>${cvr.toFixed(2)}%</b></div><div class="metric">CPA<b>${Math.round(cpa).toLocaleString()}원</b></div><div class="metric">ROAS<b>${roas.toFixed(2)}%</b></div><div class="metric">순이익<b>${Math.round(np).toLocaleString()}원</b></div></div>`;pr.classList.remove("hidden")}
window.addEventListener("load",()=>{const d=JSON.parse(localStorage.getItem("v5")||"{}");if(d.product){product.value=d.product||"";brand.value=d.brand||"";url.value=d.url||"";cta.value=d.cta||"바로가기"};if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{})});
</script></body></html>
